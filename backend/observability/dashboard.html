<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>知衡·ProofGraph｜系统洞察</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#dce2eb;--blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626;--violet:#7c3aed;--shadow:0 10px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 22px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:11px;padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-weight:700}.badge.warn{background:#fff7ed;color:#b45309;border-color:#fed7aa}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 73px)} aside{border-right:1px solid var(--line);background:#fbfcfe;padding:14px;overflow:auto}.main{padding:18px;min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar button,.toolbar input{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}.toolbar button{cursor:pointer}.workflow{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}.workflow.active{border-color:#93c5fd;background:#eff6ff}.workflow .id{font-size:12px;font-weight:800}.workflow .goal{font-size:12px;color:var(--muted);margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;align-items:center;gap:8px}.status{font-size:10px;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#4338ca}.small{font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.metric{font-size:22px;font-weight:800;margin-top:6px}.label{font-size:11px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}.panel h2{font-size:15px;margin:0 0 12px}.panel h3{font-size:13px;margin:14px 0 8px}.note{font-size:11px;color:var(--muted);line-height:1.6}
.pipeline{display:grid;grid-template-columns:repeat(10,minmax(105px,1fr));gap:7px;overflow-x:auto;padding-bottom:6px}.stage{min-height:112px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfcfe}.stage.success{border-color:#86efac;background:#f0fdf4}.stage.running{border-color:#93c5fd;background:#eff6ff}.stage.failed{border-color:#fca5a5;background:#fef2f2}.stage.skipped,.stage.not_in_generation_request{opacity:.55}.stage .name{font-size:12px;font-weight:800}.stage .summary{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.45;max-height:44px;overflow:hidden}.stage .state{font-size:10px;margin-top:6px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.bar{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#7c3aed)}.kv{display:grid;grid-template-columns:180px 1fr;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px dashed #edf0f5}.kv b{font-weight:600;color:#4b5563}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}th{color:#64748b;font-weight:700}.scroll{overflow:auto;max-height:360px}
.claim{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.claim.pass{border-left:4px solid var(--green)}.claim.reject{border-left:4px solid var(--red)}.claim.need_confirmation{border-left:4px solid var(--amber)}.claim.downgrade{border-left:4px solid var(--violet)}.claim .title{font-size:11px;font-weight:800}.claim .text{font-size:11px;margin:6px 0;line-height:1.5}.claim .meta{font-size:10px;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#dbeafe;border-radius:12px;padding:13px;max-height:520px;overflow:auto;font-size:11px;line-height:1.55}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:11px}.tabs button.active{background:#172033;color:#fff;border-color:#172033}.tab{display:none}.tab.active{display:block}
#proofSvg{width:100%;height:430px;background:#fbfcfe;border:1px solid var(--line);border-radius:12px}.empty{padding:34px;text-align:center;color:var(--muted)}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(5,minmax(130px,1fr))}}
@media(max-width:780px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:220px}.cards{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(2,minmax(140px,1fr))}}
</style>
</head>
<body>
<header>
  <div><h1>知衡·ProofGraph｜系统洞察</h1><div class="sub">只读旁路：直接读取已持久化 WorkflowState / AgentRun，不参与主链决策</div></div>
  <div class="row"><span class="badge">READ ONLY</span><span id="liveBadge" class="badge warn">等待工作流</span></div>
</header>
<div class="layout">
<aside>
  <div class="toolbar"><button id="refreshList">刷新</button><button id="autoBtn">自动刷新：开</button></div>
  <div id="workflowList"></div>
</aside>
<main class="main">
  <div id="empty" class="panel empty">暂无工作流。先从正常业务入口发起一次学习任务，本页不会创建任何模拟数据。</div>
  <div id="content" style="display:none">
    <div class="cards" id="metricCards"></div>
    <section class="panel"><h2>主链状态</h2><div id="pipeline" class="pipeline"></div></section>
    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="tab-learning" class="tab"></div>
      <div id="tab-diagnosis" class="tab"></div>
      <div id="tab-retrieval" class="tab"></div>
      <div id="tab-risk" class="tab"></div>
      <div id="tab-agents" class="tab"></div>
      <div id="tab-proof" class="tab"></div>
      <div id="tab-log" class="tab"></div>
      <div id="tab-raw" class="tab"></div>
    </section>
  </div>
</main>
</div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let selected='', auto=true, timer=null, current=null, activeTab='learning';
const tabs=[['learning','学情/路径'],['diagnosis','自适应诊断'],['retrieval','检索证据'],['risk','风险路由'],['agents','Agent输出'],['proof','ProofGraph'],['log','人类日志'],['raw','原始结构']];
function fmtPct(v){return typeof v==='number'?(v*100).toFixed(1)+'%':'-'} function fmtMs(v){if(v==null)return'-';return v>1000?(v/1000).toFixed(2)+' s':v+' ms'}
async function jget(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadList(){try{const d=await jget('/api/observability/workflows/recent?limit=30');renderList(d.items||[]);if(!selected&&d.items?.length){selected=d.items[0].workflow_id;await loadOne()} }catch(e){$('#workflowList').innerHTML='<div class="small">读取失败：'+esc(e.message)+'</div>'}}
function renderList(items){$('#workflowList').innerHTML=items.map(w=>`<div class="workflow ${w.workflow_id===selected?'active':''}" data-id="${esc(w.workflow_id)}"><div class="row"><span class="id">${esc(w.workflow_id)}</span><span class="status">${esc(w.status)}</span></div><div class="goal">${esc(w.target_goal||'未填写目标')}</div><div class="small">${esc(w.route||'未路由')} · ${esc(w.domain_id)}</div></div>`).join('')||'<div class="small">暂无工作流</div>';document.querySelectorAll('.workflow').forEach(el=>el.onclick=async()=>{selected=el.dataset.id;await loadOne();await loadList()})}
async function loadOne(){if(!selected)return;try{current=await jget('/api/observability/workflows/'+encodeURIComponent(selected));render(current);$('#empty').style.display='none';$('#content').style.display='block'}catch(e){$('#empty').textContent='读取 '+selected+' 失败：'+e.message;$('#empty').style.display='block';$('#content').style.display='none'}}
function cards(d){const m=d.metrics||{},o=d.overview||{};return [['状态',o.current_state],['风险路径',(m.route||'-').toUpperCase()],['PreRisk',m.pre_risk??'-'],['证据',m.evidence_count??0],['Claims',m.claim_count??0],['总耗时',fmtMs(m.workflow_duration_ms)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${esc(x[1])}</div></div>`).join('')}
function render(d){$('#metricCards').innerHTML=cards(d);$('#liveBadge').textContent=d.overview.current_state==='PUBLISHED'?'已发布':d.overview.current_state==='FAILED'?'失败':'实时更新';$('#liveBadge').className='badge '+(d.overview.current_state==='FAILED'?'warn':'');$('#pipeline').innerHTML=(d.pipeline||[]).map(s=>`<div class="stage ${esc(s.status)}"><div class="name">${esc(s.label)}</div><div class="state">${esc(s.status)} · ${s.attempts||0}次</div><div class="summary">${esc(s.summary||s.description)}</div><div class="small">${fmtMs(s.duration_ms)}</div></div>`).join('');renderTabs();renderLearning(d);renderDiagnosis(d);renderRetrieval(d);renderRisk(d);renderAgents(d);renderProof(d);renderLog(d);renderRaw(d)}
function renderTabs(){const c=$('#tabs');c.innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" class="${activeTab===t[0]?'active':''}">${t[1]}</button>`).join('');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderTabs();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('#tab-'+activeTab).classList.add('active')});document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('#tab-'+activeTab).classList.add('active')}
function kv(obj,keys){return keys.map(([k,l])=>`<div class="kv"><b>${esc(l)}</b><span>${esc(obj?.[k]??'-')}</span></div>`).join('')}
function renderLearning(d){const l=d.layers.learner_model||{},m=l.mastery_summary||{},p=d.layers.planner||{};$('#tab-learning').innerHTML=`<div class="grid2"><div><h2>LearnerModel</h2>${kv(m,[['overall_mastery','整体掌握度'],['overall_uncertainty','整体不确定性'],['recommended_level','推荐难度'],['concept_coverage','概念覆盖']])}<h3>薄弱概念</h3><div class="chips">${(l.weak_concepts||[]).slice(0,12).map(x=>`<span class="chip">${esc(x.name||x.concept_id)} · ${fmtPct(x.mastery_probability)}</span>`).join('')||'-'}</div></div><div><h2>Planner</h2><div class="chips">${(p.target_skills||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'-'}</div><h3>学习路径</h3><pre>${esc(JSON.stringify(p.learning_path||[],null,2))}</pre></div></div>`}
function renderDiagnosis(d){const x=d.layers.diagnosis||{},s=x.session||{},rows=x.responses||[];$('#tab-diagnosis').innerHTML=`<h2>自适应诊断</h2>${kv({mode:x.mode,session_id:s.session_id,status:s.status,question_count:s.question_count},[['mode','模式'],['session_id','Session'],['status','状态'],['question_count','题目数']])}<div class="scroll"><table><thead><tr><th>#</th><th>题目</th><th>技能/概念</th><th>正确</th><th>难度</th><th>选择分数</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.item_id)}</td><td>${esc(r.skill_id)}<br><span class="small">${esc((r.concept_ids||[]).join(', '))}</span></td><td>${r.is_correct?'✓':'✗'}</td><td>${esc(r.difficulty)}</td><td><pre style="max-height:120px">${esc(JSON.stringify(r.selection_score||{},null,2))}</pre></td></tr>`).join('')}</tbody></table></div><p class="note">每一道题显示的是持久化的选择评分与答题结果，不重构模型隐式推理。</p>`}
function renderRetrieval(d){const x=d.layers.retrieval||{},m=x.meta||{},e=x.evidence||[];$('#tab-retrieval').innerHTML=`<div class="grid2"><div><h2>检索配置</h2>${kv(m,[['retrieval_method','检索方法'],['source_mode','来源模式'],['version_filter','版本过滤'],['vector_search','向量检索'],['mmr_applied','MMR'],['concept_gain_applied','ConceptGain'],['source_gain_applied','SourceGain'],['graph_expansion_applied','图扩展']])}</div><div><h2>查询信号</h2><div class="chips">${(m.query_terms||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'-'}</div><h3>扩展技能</h3><div class="chips">${(m.expanded_skills||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'-'}</div></div></div><h3>最终 Evidence</h3><div class="scroll"><table><thead><tr><th>ID</th><th>标题</th><th>相关度</th><th>验证</th><th>版本</th><th>概念</th></tr></thead><tbody>${e.map(x=>`<tr><td>${esc(x.evidence_id)}</td><td>${esc(x.title)}</td><td>${esc(x.relevance_score)}</td><td>${esc(x.verification_status)}</td><td>${esc(x.version)}</td><td>${esc((x.concept_ids||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`}
function riskBar(label,v){const n=typeof v==='number'?Math.max(0,Math.min(1,v)):0;return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span class="small">${label}</span><b>${typeof v==='number'?v.toFixed(3):'-'}</b></div><div class="bar"><i style="width:${n*100}%"></i></div></div>`}
function renderRisk(d){const r=d.layers.risk_router||{};$('#tab-risk').innerHTML=`<div class="grid2"><div><h2>风险构成</h2>${riskBar('Domain Risk',r.domain_risk)}${riskBar('Uncertainty',r.uncertainty)}${riskBar('Retrieval Weakness',r.retrieval_weakness)}${riskBar('Novelty',r.novelty)}${riskBar('PreRisk',r.pre_risk)}</div><div><h2>路由决策</h2>${kv(r,[['route','路径'],['model_call_budget','模型调用预算'],['requires_critic','需要 Critic'],['requires_judge','需要 Judge'],['force_strict','强制 Strict']])}<h3>显式原因</h3><div class="chips">${(r.reasons||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'-'}</div></div></div>`}
function renderAgents(d){$('#tab-agents').innerHTML=`<h2>结构化 Agent 输入/输出</h2><p class="note">以下为数据库中的 AgentRun。点击浏览的是显式结构化结果，不展示隐式思维链。</p>${(d.timeline||[]).map(x=>`<details class="claim"><summary><b>${esc(x.agent)}</b> · ${esc(x.status)} · ${fmtMs(x.duration_ms)} · ${esc(x.summary||'')}</summary><h3>Input</h3><pre>${esc(JSON.stringify(x.input||{},null,2))}</pre><h3>Output</h3><pre>${esc(JSON.stringify(x.output||{},null,2))}</pre></details>`).join('')||'<div class="empty">暂无 AgentRun</div>'}`}
function renderProof(d){const g=d.layers.proofgraph||{},s=g.summary||{},claims=g.claims||[];$('#tab-proof').innerHTML=`<div class="grid3"><div class="card"><div class="label">Claims</div><div class="metric">${s.claim_count||0}</div></div><div class="card"><div class="label">Validated</div><div class="metric">${s.validated_claim_count||0}</div></div><div class="card"><div class="label">High-risk Traceability</div><div class="metric">${fmtPct(s.high_risk_traceability)}</div></div></div><h3>图结构</h3><svg id="proofSvg"></svg><h3>声明详情</h3><div class="scroll">${claims.map(c=>`<div class="claim ${(c.final_disposition||'').toLowerCase()}"><div class="title">${esc(c.claim_id)} · ${esc(c.final_disposition)} · risk=${esc(c.risk_level)}</div><div class="text">${esc(c.text||c.command||'-')}</div><div class="meta">Evidence: ${esc((c.evidence_ids||[]).join(', ')||'-')} ｜ Validators: ${esc((c.validator_ids||[]).join(', ')||'-')} ｜ ${esc(c.evidence_status)}</div></div>`).join('')||'<div class="empty">尚未生成 ProofGraph</div>'}</div>`;setTimeout(()=>drawGraph(g),0)}
function drawGraph(g){const svg=$('#proofSvg');if(!svg)return;const claims=(g.claims||[]).slice(0,6), edges=g.edges||[];if(!claims.length){svg.innerHTML='<text x="20" y="40" fill="#64748b">暂无 ProofGraph 数据</text>';return}const W=1000,H=420;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const nodes=[],lines=[];claims.forEach((c,i)=>{const y=55+i*60;nodes.push({id:c.claim_id,x:420,y,label:'Claim '+(i+1),kind:'claim'});(c.evidence_ids||[]).slice(0,2).forEach((id,j)=>nodes.push({id:id+'_'+i,x:70,y:y+(j?18:-18),label:id,kind:'evidence'}));(c.validator_ids||[]).slice(0,2).forEach((id,j)=>nodes.push({id:id+'_'+i,x:760,y:y+(j?18:-18),label:id,kind:'validator'}));});claims.forEach((c,i)=>{const y=55+i*60;(c.evidence_ids||[]).slice(0,2).forEach((id,j)=>lines.push([230,y+(j?18:-18),420,y]));(c.validator_ids||[]).slice(0,2).forEach((id,j)=>lines.push([600,y,760,y+(j?18:-18)]))});svg.innerHTML=lines.map(l=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#cbd5e1" stroke-width="2"/>`).join('')+nodes.map(n=>`<g><rect x="${n.x}" y="${n.y-16}" width="${n.kind==='claim'?180:170}" height="32" rx="8" fill="${n.kind==='claim'?'#eff6ff':n.kind==='evidence'?'#ecfdf5':'#fff7ed'}" stroke="${n.kind==='claim'?'#93c5fd':n.kind==='evidence'?'#86efac':'#fdba74'}"/><text x="${n.x+8}" y="${n.y+4}" font-size="10" fill="#334155">${esc(n.label).slice(0,24)}</text></g>`).join('')}
async function renderLog(d){const el=$('#tab-log');el.innerHTML='<div class="small">正在生成人类可读日志…</div>';try{const r=await fetch('/api/observability/workflows/'+encodeURIComponent(d.overview.workflow_id)+'/human-log',{cache:'no-store'});el.innerHTML='<pre>'+esc(await r.text())+'</pre>'}catch(e){el.innerHTML='<pre>'+esc(e.message)+'</pre>'}}
function renderRaw(d){$('#tab-raw').innerHTML=`<p class="note">原始观测视图可用于调试和答辩取证；它来自持久化状态，不会写回核心系统。</p><pre>${esc(JSON.stringify(d,null,2))}</pre>`}
$('#refreshList').onclick=async()=>{await loadList();await loadOne()};$('#autoBtn').onclick=()=>{auto=!auto;$('#autoBtn').textContent='自动刷新：'+(auto?'开':'关')};
async function tick(){if(auto){await loadList();if(selected)await loadOne()}timer=setTimeout(tick,1500)}
loadList().then(tick);
</script>
</body>
</html>
